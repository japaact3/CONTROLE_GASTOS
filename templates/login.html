
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Predileta financeiro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

    <main class="login-container">
        <section class="login-card">
            <div class="login-icon">
                <img
                    src="{{ url_for('static', filename='img/logopredileta.png') }}"
                    alt="Logo do Financeiro predileta"
                >
            </div>

            <h1>Predileta financeiro</h1>
            <p class="login-subtitle">Entre para acessar suas finanças</p>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    {% for categoria, mensagem in mensagens %}
                        <div class="login-alerta {{ categoria }}">
                            {{ mensagem }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <label for="usuario">Usuário</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                    autofocus
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="login-button">
                    Entrar
                </button>
            </form>

            <p class="login-footer">Acesso restrito</p>
        </section>
    </main>

</body>
</html>
